name: Build BenchGram Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - benchgram
      - main
      - master

jobs:
  build:
    name: Build Debug APK (afat)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout BenchGram repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          set +o pipefail
          yes | "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Inject Telegram API credentials into BuildVars.java
        env:
          TG_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TG_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
        run: |
          BUILD_VARS="TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          if [ -z "$TG_APP_ID" ] || [ -z "$TG_APP_HASH" ]; then
            echo "ERROR: TELEGRAM_APP_ID or TELEGRAM_APP_HASH secret is missing!"
            exit 1
          fi
          sed -i "s/public static int APP_ID = .*/public static int APP_ID = ${TG_APP_ID};/" "$BUILD_VARS"
          sed -i "s/public static String APP_HASH = .*/public static String APP_HASH = \"${TG_APP_HASH}\";/" "$BUILD_VARS"
          grep -n "APP_ID\|APP_HASH" "$BUILD_VARS"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build BenchGram Debug APK
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --max-workers=2

      - name: Upload BenchGram APK
        uses: actions/upload-artifact@v4
        with:
          name: BenchGram-debug-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
